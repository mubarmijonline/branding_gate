server {
	#    listen 4008 ssl;
	#    server_name 136.114.32.40;

	#    ssl_certificate /development/projects/branding_gate/cert.pem;
	#    ssl_certificate_key /development/projects/branding_gate/key.pem;



            listen 443 ssl http2;
            listen [::]:443 ssl http2;
            server_name bg.mubarmijonline.com;
	
	    # SSL Certificate Configuration
	    ssl_certificate /etc/nginx/certs/elamal.pem;
	    ssl_certificate_key /etc/nginx/certs/elamal.key;
	      
	       # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Logs
    access_log /development/projects/branding_gate/nginx_access.log;
    error_log /development/projects/branding_gate/nginx_error.log;

    # Max upload size
    client_max_body_size 50M;

    # Static files - served directly by Nginx for performance
    location /static/ {
        alias /development/projects/branding_gate/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Upload files
    location /uploads/ {
        alias /development/projects/branding_gate/uploads/;
        expires 7d;
    }

    # Proxy to Gunicorn via Unix socket
    location / {
        proxy_pass http://unix:/development/projects/branding_gate/branding_gate.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
    }
}
