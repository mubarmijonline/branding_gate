<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="">
  <meta name="author" content="">

  <title>Login</title>

  <!-- Custom fonts for this template-->
  <link href="/static/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
  <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">

  <!-- Custom styles for this template-->
  <link href="/static/css/sb-admin-2.min.css" rel="stylesheet">
  <link href="/static/css/branding-gate-system.css?v=20260726-3" rel="stylesheet">
    <link href="{{ url_for('static', filename='sweetalert/dist/sweetalert2.min.css') }}" rel="stylesheet" type="text/css">

  <script src="{{ url_for('static', filename='sweetalert/dist/sweetalert2.all.min.js') }}"></script>
  <script src="{{ url_for('static', filename='sweetalert/dist/sweetalert2.min.js') }}"></script>
</head>

{% block body %}
<body class="bg-light">

  <div class="container">

    <!-- Outer Row -->
    <div class="row justify-content-center">

      <div class="col-xl-10 col-lg-12 col-md-9">

        <div class="card o-hidden border-0 shadow-lg my-5">
          <div class="card-body p-0">
            <!-- Nested Row within Card Body -->
            <div class="row">
              <div class="col-lg-6 d-none d-lg-block">
                <img src="/static/img/branding_gate_logo.jpg" style="width: 115%; height: 90%; padding-top: 5%;">
              </div>
              <div class="col-lg-6">
                <div class="p-5">
                  <div class="text-center">
                    <h1 class="h4 text-gray-900 mb-4">Welcome Back!</h1>
                    <h1 class="h4 text-gray-900 mb-4">Branding Gate</h1>
                  </div>

                  <!-- Login Form -->
                  <form id="loginForm" class="user" action="" method="POST">
                    <div class="form-group">
                      <input
                        type="text"
                        class="form-control"
                        id="exampleInputEmail"
                        pattern="[0-9]+"
                        aria-describedby="emailHelp"
                        placeholder="Enter Your mobile..."
                        name="mobile"
                        value="{{ request.form.username }}"
                        required
                      >
                    </div>
                    <div class="form-group">
                      <input
                        type="password"
                        class="form-control"
                        id="exampleInputPassword"
                        placeholder="Password"
                        name="password"
                        value="{{ request.form.password }}"
                        required
                      >
                    </div>
                    <input type="hidden" name="fcm_token" id="fcm_token" value="">
                    <!-- Changed to <button> so we can inject a spinner inside -->
                    <button
                      type="submit"
                      id="loginButton"
                      class="btn btn-primary btn-user btn-block"
                    >
                      Login
                    </button>
                  </form>
                  <!-- /Login Form -->

                </div>
              </div>
            </div>
          </div>
        </div>

      </div>

    </div>

  </div>

  <!-- Bootstrap core JavaScript-->
  <script src="/static/vendor/jquery/jquery.min.js"></script>
  <script src="/static/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

  <!-- Core plugin JavaScript-->
  <script src="/static/vendor/jquery-easing/jquery.easing.min.js"></script>

  <!-- Custom scripts for all pages-->
  <script src="/static/js/sb-admin-2.min.js"></script>

  <!-- Page level plugins -->
  <script src="/static/vendor/chart.js/Chart.min.js"></script>

  <!-- Page level custom scripts -->
  <script src="/static/js/demo/chart-area-demo.js"></script>
  <script src="/static/js/demo/chart-pie-demo.js"></script>

  <!-- Custom script to handle form submit, show loading spinner, and wait for JSON -->
  <script>
    $(document).ready(function() {
      $('#loginForm').on('submit', function(e) {
        e.preventDefault();

        var $btn = $('#loginButton');
        var originalHtml = $btn.html();

        // Disable the button and show a spinner
        $btn.prop('disabled', true);
        $btn.html(
          '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Loading...'
        );

        // Collect form data
        var formData = $(this).serialize();

        // Send AJAX request as JSON
        $.ajax({
          url: '/login?add_login',  // Adjust the URL to your login endpoint
          type: 'POST',
          contentType: 'application/x-www-form-urlencoded',  // Use form-urlencoded for compatibility
          dataType: 'json',  // Expect JSON response
          processData: true,  // Process data as URL-encoded
          data: formData,
          
        })
        .done(function(response) {
          // Handle the response
          // Assuming the response is JSON and contains a 'success' field
          // and optionally a 'redirect' field
          // Adjust this based on your actual response structure
          
          state = response.state  // Default to 'success' if not provided
            
          // Example handler: if response.success is true, redirect; else show an alert
          if (state === 'success') {
              swal.fire({
              icon: 'success',
              title: 'Login Successful',
              text: response.message
  
            });
            window.location.href = response.redirect;
          } else {
            swal.fire({
              icon: 'error',
              title: 'Login Failed',
              text: response.message || 'Invalid username or password.'
            });
          }
        })
        .fail(function(jqXHR) {
          var errMsg = 'An error occurred';
          if (jqXHR.responseJSON && jqXHR.responseJSON.message) {
            swal.fire({
              icon: 'error',
              title: 'Error',
              text: jqXHR.responseJSON.message
            });
          }
                      swal.fire({
              icon: 'error',
              title: 'Error',
              text: errMsg
            });
        })
        .always(function() {
          // Re-enable button and restore text
          $btn.prop('disabled', false);
          $btn.html(originalHtml);
        });
      });
    });
  </script>

  <script>
// Initialize Firebase (SDK config)
firebase.initializeApp({ /* your config */ });
const messaging = firebase.messaging();

// Ask permission & get token
Notification.requestPermission()
  .then(perm => {
    if (perm !== 'granted') throw 'Denied';
    return messaging.getToken({ vapidKey: 'YOUR_VAPID_KEY' });
  })
  .then(token => {
    document.getElementById('fcm_token').value = token;
  })
  .catch(console.warn);
</script>

</body>
{% endblock %}
</html>
