<script>
// Global variables for comments system
let currentRequestId = null;
let currentCommentSource = 'all';
let mentionedUsers = [];
let allUsers = [];
let currentUserId = null; // Will be set during initialization

// Initialize comments widget
function initCommentsWidget(requestId, defaultSource = 'general') {
    console.log('===== INITIALIZING COMMENTS WIDGET =====');
    console.log('Request ID:', requestId);
    console.log('Default Source:', defaultSource);
    
    // Reset state variables
    currentRequestId = requestId;
    currentMentionPosition = -1;
    currentMentionTrigger = null;
    
    // Set default source
    $('#commentSource').val(defaultSource);
    
    // Clear textarea
    $('#commentTextarea').val('');
    
    // IMPORTANT: Load users first, then load comments
    // This ensures highlightMentions() has access to user list
    loadUsersPanel(function() {
        // Callback: After users are loaded, load comments
        loadComments();
    });
    
    console.log('===== WIDGET INITIALIZATION COMPLETE =====');
}

// Load users into the side panel
function loadUsersPanel(callback) {
    console.log('Loading users for side panel...');
    
    $.ajax({
        url: '/api/users/search',
        type: 'GET',
        data: { q: '' }, // Empty query to get all users
        success: function(response) {
            console.log('Users loaded:', response);
            if (response.success && response.users && response.users.length > 0) {
                renderUsersPanel(response.users);
                console.log('Users rendered successfully. User count:', response.users.length);
            } else {
                $('#usersList').html('<div class="text-center py-3 text-muted"><i class="fas fa-users-slash"></i><p class="small mb-0 mt-2">No users found</p></div>');
            }
            
            // Execute callback after users are loaded and rendered
            if (callback && typeof callback === 'function') {
                console.log('Executing callback after users loaded');
                callback();
            }
        },
        error: function(xhr, status, error) {
            console.error('Error loading users:', error);
            $('#usersList').html('<div class="text-center py-3 text-danger"><i class="fas fa-exclamation-triangle"></i><p class="small mb-0 mt-2">Error loading users</p></div>');
            
            // Execute callback even on error (so comments still load)
            if (callback && typeof callback === 'function') {
                console.log('Executing callback after user load error');
                callback();
            }
        }
    });
}

// Render users in the panel
function renderUsersPanel(users) {
    console.log('Rendering users panel with', users.length, 'users');
    let html = '';
    
    users.forEach(user => {
        const initials = user.name.substring(0, 2).toUpperCase();
        html += `
            <div class="user-item" draggable="true" data-user-id="${user.id}" data-user-name="${user.name}">
                <div class="user-item-avatar">${initials}</div>
                <div class="user-item-info">
                    <div class="user-item-name">${user.name}</div>
                    <div class="user-item-mobile">${user.mobile || 'No phone'}</div>
                </div>
                <i class="fas fa-grip-vertical user-item-drag-icon"></i>
            </div>
        `;
    });
    
    $('#usersList').html(html);
    
    // Setup drag and drop
    setupDragAndDrop();
}

// Setup drag and drop functionality
function setupDragAndDrop() {
    const userItems = document.querySelectorAll('.user-item');
    const textarea = document.getElementById('commentTextarea');
    let isDragging = false;
    
    // Drag start
    userItems.forEach(item => {
        item.addEventListener('dragstart', function(e) {
            isDragging = true;
            const userName = this.getAttribute('data-user-name');
            e.dataTransfer.setData('text/plain', '@' + userName + ' ');
            e.dataTransfer.effectAllowed = 'copy';
            this.style.opacity = '0.5';
        });
        
        item.addEventListener('dragend', function(e) {
            this.style.opacity = '1';
            // Reset dragging flag after a short delay to allow drop to complete
            setTimeout(() => {
                isDragging = false;
            }, 100);
        });
        
        // Also support click to insert
        item.addEventListener('click', function(e) {
            // Only insert on click if we're NOT dragging
            if (!isDragging) {
                const userName = this.getAttribute('data-user-name');
                insertMentionAtCursor('@' + userName + ' ');
            }
        });
    });
    
    // Drop zone (textarea)
    textarea.addEventListener('dragover', function(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
        this.style.borderColor = '#667eea';
        this.style.backgroundColor = '#f0f4ff';
    });
    
    textarea.addEventListener('dragleave', function(e) {
        this.style.borderColor = '#e9ecef';
        this.style.backgroundColor = 'white';
    });
    
    textarea.addEventListener('drop', function(e) {
        e.preventDefault();
        const mention = e.dataTransfer.getData('text/plain');
        
        // Insert at cursor position
        const cursorPos = this.selectionStart;
        const textBefore = this.value.substring(0, cursorPos);
        const textAfter = this.value.substring(cursorPos);
        this.value = textBefore + mention + textAfter;
        
        // Move cursor after the inserted mention
        const newCursorPos = cursorPos + mention.length;
        this.setSelectionRange(newCursorPos, newCursorPos);
        this.focus();
        
        // Reset styles
        this.style.borderColor = '#e9ecef';
        this.style.backgroundColor = 'white';
        
        console.log('Dropped mention:', mention);
    });
}

// Insert mention at current cursor position
function insertMentionAtCursor(mention) {
    const textarea = document.getElementById('commentTextarea');
    const cursorPos = textarea.selectionStart;
    const textBefore = textarea.value.substring(0, cursorPos);
    const textAfter = textarea.value.substring(cursorPos);
    
    textarea.value = textBefore + mention + textAfter;
    
    // Move cursor after the inserted mention
    const newCursorPos = cursorPos + mention.length;
    textarea.setSelectionRange(newCursorPos, newCursorPos);
    textarea.focus();
    
    console.log('Inserted mention at cursor:', mention);
}

// Search users in the panel
$(document).on('input', '#userSearchInput', function() {
    const searchTerm = $(this).val().toLowerCase();
    console.log('Searching users:', searchTerm);
    
    $('.user-item').each(function() {
        const userName = $(this).find('.user-item-name').text().toLowerCase();
        const userMobile = $(this).find('.user-item-mobile').text().toLowerCase();
        
        if (userName.includes(searchTerm) || userMobile.includes(searchTerm)) {
            $(this).show();
        } else {
            $(this).hide();
        }
    });
});

// Toggle comments widget visibility
function toggleCommentsWidget() {
    const widget = $('#commentsWidget');
    if (widget.is(':visible')) {
        widget.slideUp(300);
    } else {
        widget.slideDown(300);
        if (currentRequestId) {
            loadComments();
        }
    }
}

// Filter comments by source
function filterCommentsBySource(source) {
    currentCommentSource = source;
    
    // Update active tab
    $('.comment-tab').removeClass('active');
    $(`.comment-tab[data-source="${source}"]`).addClass('active');
    
    loadComments();
}

// Load comments from server
function loadComments() {
    if (!currentRequestId) {
        console.warn('Cannot load comments: no request ID set');
        return;
    }
    
    console.log('Loading comments for request:', currentRequestId, 'source:', currentCommentSource);
    
    const params = new URLSearchParams();
    if (currentCommentSource && currentCommentSource !== 'all') {
        params.append('source', currentCommentSource);
    }
    
    const url = `/api/sales/requests/${currentRequestId}/comments?${params.toString()}`;
    console.log('Fetching from:', url);
    
    $.get(url, function(response) {
        console.log('Comments loaded:', response);
        if (response.success) {
            renderComments(response.comments);
            updateUnreadMentionsCount(response.unread_mentions);
        }
    }).fail(function(xhr, status, error) {
        console.error('Failed to load comments:', xhr, status, error);
        console.error('Response:', xhr.responseText);
        Swal.fire('Error', 'Failed to load comments', 'error');
    });
}

// Render comments in the list
function renderComments(comments) {
    const container = $('#commentsList');
    
    if (comments.length === 0) {
        container.html(`
            <div class="empty-comments">
                <i class="fas fa-comments"></i>
                <p>No comments yet. Be the first to comment!</p>
            </div>
        `);
        return;
    }
    
    let html = '';
    comments.forEach(comment => {
        const isOwnComment = comment.user_id == currentUserId;
        const commentClass = comment.is_note ? 'is-note' : '';
        
        // Highlight mentions in text - match only known usernames
        let commentText = escapeHtml(comment.comment_text);
        commentText = highlightMentions(commentText);
        
        html += `
            <div class="comment-item ${commentClass}" data-comment-id="${comment.id}">
                <div class="comment-header">
                    <div>
                        <span class="comment-author">
                            <i class="fas fa-user-circle"></i> ${comment.user_name}
                        </span>
                        <span class="comment-source-badge source-${comment.source}">
                            ${formatSourceLabel(comment.source)}
                        </span>
                        ${comment.is_note ? '<span class="badge badge-warning ml-2"><i class="fas fa-sticky-note"></i> Note</span>' : ''}
                    </div>
                    <span class="comment-time">
                        <i class="far fa-clock"></i> ${formatRelativeTime(comment.created_at)}
                    </span>
                </div>
                
                <div class="comment-text">${commentText}</div>
                
                ${comment.mentioned_users ? `
                    <div style="margin-top: 8px; font-size: 0.8rem; color: #6c757d;">
                        <i class="fas fa-at"></i> Mentioned: ${comment.mentioned_users}
                    </div>
                ` : ''}
                
                ${isOwnComment ? `
                    <div class="comment-footer">
                        <div></div>
                        <div class="comment-actions-btns">
                            <button class="comment-btn comment-btn-delete" onclick="deleteComment(${comment.id})">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        </div>
                    </div>
                ` : ''}
            </div>
        `;
    });
    
    container.html(html);
}

// Extract mentions from comment text and populate mentionedUsers array
function extractMentionsFromText(text) {
    console.log('Extracting mentions from text:', text);
    
    // Clear previous mentions
    mentionedUsers = [];
    
    // Match all @mentions in the text (supports dots, underscores, hyphens, spaces)
    // Pattern: @ followed by word chars, dots, hyphens (and optional spaces followed by more of these)
    const mentionRegex = /@([\w\.\-]+(?:\s[\w\.\-]+)*)/g;
    const matches = text.matchAll(mentionRegex);
    
    const extractedUsernames = [];
    for (const match of matches) {
        const username = match[1].trim(); // Remove any trailing spaces
        if (username && !extractedUsernames.includes(username)) {
            extractedUsernames.push(username);
        }
    }
    
    console.log('Extracted usernames:', extractedUsernames);
    
    // Match usernames to user IDs from the loaded users panel
    $('.user-item').each(function() {
        const userName = $(this).data('user-name');
        const userId = $(this).data('user-id');
        
        if (extractedUsernames.includes(userName) && !mentionedUsers.includes(userId)) {
            mentionedUsers.push(userId);
        }
    });
    
    console.log('Resolved user IDs:', mentionedUsers);
}

// Highlight mentions in text by matching exact usernames from user list
function highlightMentions(text) {
    // Get all known usernames from the user panel
    const knownUsernames = [];
    $('.user-item').each(function() {
        const userName = $(this).data('user-name');
        if (userName) {
            knownUsernames.push(userName);
        }
    });
    
    // If no users loaded yet, return text as-is
    if (knownUsernames.length === 0) {
        return text;
    }
    
    // Sort usernames by length (longest first) to avoid partial matches
    // Example: Match "@John Smith" before "@John" to avoid incorrect partial match
    knownUsernames.sort((a, b) => b.length - a.length);
    
    // Escape special regex characters in usernames and create pattern
    let highlightedText = text;
    knownUsernames.forEach(username => {
        // Escape special regex characters in username
        const escapedUsername = username.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        
        // Create regex: @ followed by exact username, followed by word boundary or space
        const regex = new RegExp(`@(${escapedUsername})(?=\\s|$|[.,!?;:)])`, 'gi');
        
        // Replace with highlighted version
        highlightedText = highlightedText.replace(regex, '<span class="mention-tag">@$1</span>');
    });
    
    return highlightedText;
}

// Post new comment
function postComment() {
    console.log('postComment() called');
    
    const commentText = $('#commentTextarea').val().trim();
    const source = $('#commentSource').val();
    const isNote = $('#isNoteCheckbox').is(':checked');
    
    // Extract all mentions from text and match to user IDs
    extractMentionsFromText(commentText);
    
    console.log('Comment data:', { commentText, source, isNote, currentRequestId, mentionedUsers });
    
    if (!commentText) {
        Swal.fire('Warning', 'Please enter a comment', 'warning');
        return;
    }
    
    if (!currentRequestId) {
        Swal.fire('Error', 'No request selected', 'error');
        return;
    }
    
    const data = {
        comment_text: commentText,
        source: source,
        is_note: isNote,
        mentioned_users: mentionedUsers
    };
    
    console.log('Sending comment to API:', data);
    
    $.ajax({
        url: `/api/sales/requests/${currentRequestId}/comments`,
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify(data),
        success: function(response) {
            console.log('Comment posted successfully:', response);
            if (response.success) {
                $('#commentTextarea').val('');
                $('#isNoteCheckbox').prop('checked', false);
                mentionedUsers = [];
                loadComments();
                
                // Update comment count in details modal if function exists
                if (typeof fetchCommentsCount === 'function' && currentRequestId) {
                    fetchCommentsCount(currentRequestId);
                }
                
                if (response.notifications_sent > 0) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Comment Posted!',
                        text: `Notifications sent to ${response.notifications_sent} user(s)`,
                        timer: 2000
                    });
                } else {
                    Swal.fire({
                        icon: 'success',
                        title: 'Comment Posted!',
                        timer: 1500,
                        showConfirmButton: false
                    });
                }
            }
        },
        error: function(xhr, status, error) {
            console.error('Failed to post comment:', xhr, status, error);
            console.error('Response:', xhr.responseText);
            Swal.fire('Error', 'Failed to post comment: ' + (xhr.responseJSON?.error || error), 'error');
        }
    });
}

// Delete comment
function deleteComment(commentId) {
    Swal.fire({
        title: 'Delete Comment?',
        text: 'This action cannot be undone',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#dc3545',
        confirmButtonText: 'Yes, delete it'
    }).then((result) => {
        if (result.isConfirmed) {
            $.ajax({
                url: `/api/sales/requests/comments/${commentId}`,
                method: 'DELETE',
                success: function(response) {
                    if (response.success) {
                        loadComments();
                        
                        // Update comment count in details modal if function exists
                        if (typeof fetchCommentsCount === 'function' && currentRequestId) {
                            fetchCommentsCount(currentRequestId);
                        }
                        
                        Swal.fire('Deleted!', 'Comment has been deleted', 'success');
                    }
                },
                error: function() {
                    Swal.fire('Error', 'Failed to delete comment', 'error');
                }
            });
        }
    });
}

// @Mention functionality - Use delegated event handler
$(document).on('input', '#commentTextarea', function(e) {
    const text = $(this).val();
    const cursorPos = this.selectionStart;
    const textBeforeCursor = text.substring(0, cursorPos);
    
    // Check if @ symbol was just typed
    const atMatch = textBeforeCursor.match(/@(\w*)$/);
    
    if (atMatch) {
        const searchTerm = atMatch[1];
        searchUsersForMention(searchTerm);
    } else {
        $('#mentionSuggestions').removeClass('show');
    }
});

// Search users for mention
function searchUsersForMention(searchTerm) {
    // Show all users when just @ is typed (no search term yet)
    // searchTerm will be empty string "" when user types just @
    
    $.get(`/api/users/search?q=${searchTerm}`, function(response) {
        if (response.success && response.users.length > 0) {
            renderMentionSuggestions(response.users);
        } else {
            $('#mentionSuggestions').removeClass('show');
        }
    });
}

// Handle mention item click using event delegation
$(document).on('click', '.mention-item', function() {
    const userId = $(this).data('user-id');
    const userName = $(this).data('user-name');
    console.log('Mention item clicked:', userId, userName);
    selectMention(userId, userName);
});

// Select a user from mention suggestions
function selectMention(userId, userName) {
    console.log('Selecting mention:', userId, userName);
    const textarea = $('#commentTextarea')[0];
    const text = textarea.value;
    const cursorPos = textarea.selectionStart;
    const textBeforeCursor = text.substring(0, cursorPos);
    const textAfterCursor = text.substring(cursorPos);
    
    // Find the @ symbol position
    const atPos = textBeforeCursor.lastIndexOf('@');
    
    // Replace @partial with @username
    const newText = textBeforeCursor.substring(0, atPos) + `@${userName} ` + textAfterCursor;
    textarea.value = newText;
    
    // Move cursor after the mention
    const newCursorPos = atPos + userName.length + 2;
    textarea.setSelectionRange(newCursorPos, newCursorPos);
    textarea.focus();
    
    // Add to mentioned users list
    if (!mentionedUsers.includes(userId)) {
        mentionedUsers.push(userId);
    }
    
    $('#mentionSuggestions').removeClass('show');
}

// Utility functions
function formatSourceLabel(source) {
    const labels = {
        'general': 'General',
        'client_approval': 'Client Approval',
        'costing': 'Costing',
        'selling_price': 'Selling Price',
        'operations': 'Operations',
        'logistics': 'Logistics',
        'design': 'Design',
        'production': 'Production'
    };
    return labels[source] || source;
}

function formatRelativeTime(timestamp) {
    const now = new Date();
    const past = new Date(timestamp);
    const diffMs = now - past;
    const diffMins = Math.floor(diffMs / 60000);
    const diffHours = Math.floor(diffMs / 3600000);
    const diffDays = Math.floor(diffMs / 86400000);
    
    if (diffMins < 1) return 'Just now';
    if (diffMins < 60) return `${diffMins}m ago`;
    if (diffHours < 24) return `${diffHours}h ago`;
    if (diffDays < 7) return `${diffDays}d ago`;
    return past.toLocaleDateString();
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Hide mention suggestions when clicking outside
$(document).on('click', function(e) {
    if (!$(e.target).closest('#commentTextarea, #mentionSuggestions').length) {
        $('#mentionSuggestions').removeClass('show');
    }
});
